until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.247]
r = [0.49, 0.088]

# ---------------------------------------------------------------- 14 Curl around the stop
[[chapter]]
id = "curl"
title = "Curl around the stop"
number = 14
narration = """A different shape: two positive lenses outside, two negative menisci inside, all curled around the stop,
so every surface meets the light almost head-on.
Alvan Clark patented this in 1888, five years before the triplet.
Our version uses one glass per element, and the colour fringes are back."""
lens = "clark"
fstop = 4
tail = 1.4
tool = "curl around the stop"

[[chapter.tag]]
at = "@curled"
kind = "fix"
text = "curl around the stop"

[[chapter.note]]
at = "@curled"
until = "@Alvan"
on = "diagram"
shape = "label"
pos = [-50.0, 15.0]
text = "menisci curled around the stop"

[[chapter.note]]
at = "@fringes"
until = "end"
on = "centre"
shape = "circle"
pos = [0.765, 0.5]
r = [0.12, 0.18]
text = "colour fringe"

[[chapter.note]]
at = "@colour"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.597]
r = [0.49, 0.048]

# ---------------------------------------------------------------- 15 Buried surface
[[chapter]]
id = "planar"
title = "The buried surface"
number = 15
narration = """Paul Rudolph's Planar of 1896 cements a flint to each inner meniscus.
The buried glue surface fixes the colour without changing the curves the outside needs, and the lens works at f/2.8.
But the corners are soft: for a distant subject, a symmetric lens no longer cancels its coma."""
lens = "planar"
fstop = 2.8
tail = 1.4
tool = "buried cemented surface"

[[chapter.key]]
at = "@cements"
highlight = [2, 3]

[[chapter.key]]
at = "@But"
highlight = -1

[[chapter.tag]]
at = "@buried"
kind = "fix"

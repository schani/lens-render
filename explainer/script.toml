# The explainer video "Why does a sharp picture take six pieces of glass?",
# recorded by scripts/explainer_video.py.
#
# Each [[chapter]] has narration (spoken by ElevenLabs), a title, and the
# state it starts from: any property below, set directly in the chapter.
# Everything carries over from the previous chapter unless changed.
#
# Times: seconds from the chapter start, "@word" (start of the first word
# in the narration beginning with it; "@word#2" for the second), "end",
# "speech_end", each with an optional offset ("@glow+0.3", "end-2").
#
# [[chapter.key]]   at, dur (or to = time), ease (inout|in|out|linear),
#                   morph = true (a lens change morphs the prescription
#                   instead of crossfading), and the properties to animate.
# [[chapter.note]]  annotation: at, until (or dur), on (render | centre |
#                   corner | diagram | view | scoreboard | hud | toolbox |
#                   screen), shape (circle | arrow | box | label), pos, r
#                   (radii, normalised like pos; diagram: mm),
#                   to (arrow head), text, text_at, color.
#                   Coordinates are normalised (x right, y down) except on
#                   the diagram: [mm from the sensor along the axis, mm up].
# [[chapter.tag]]   at, until, kind (problem | fix), text.
# tool              toolbox entry, added at tool_at (default "end-2").
#
# Properties: scene, lens, fstop, focus (m), offset (mm sensor shift, or
# "corner": focus the corners), ev, dim (1: darken when stopping down past
# dim_ref; 0: exposure compensated by the shutter), split_lens, split
# (divider position; 0 = no split), split_fstop, full (1: render fills the
# screen), centre / corner (inset crop centres), inset_zoom, fields (ray
# fans at these fractions of the image diagonal: 0, 0.7, 1), rays,
# by_wavelength, highlight (glass pieces, 0 = front; -1 none), diagram_zoom
# (magnification of the cross-section about the sensor), zoom_len /
# zoom_height (focus zoom ranges in mm, 0 = auto), field_range, and the
# switches focus_zoom, field_curves, bending, ideal_grid, scoreboard, hud,
# insets, diagram, beam, recap, toolbox.
#
# Positions in the lesson scene (render coordinates): centre light
# [0.562, 0.5], centre star [0.5, 0.5], 0.7-field light [0.85, 0.15], corner
# light [0.098, 0.92], corner star [0.036, 0.92]. In both insets the star is
# at [0.236, 0.5] and the light at [0.765, 0.5].
#
# Every number spoken was checked against lenses/explainer/README.md and the
# scoreboard (metrics::scoreboard).

[settings]
fps = 30
render_width = 1800
speed = 1.0
lead = 0.35
tail = 0.9
bending = "lenses/explainer/bending.json"

[scenes]
lesson = "scenes/lesson.toml"
real = "scenes/garden.toml"

[lenses]
singlet = { file = "lenses/explainer/01-singlet.lens", label = "Single lens, equiconvex" }
flat = { file = "lenses/explainer/02b-flat-front.lens", label = "Single lens, flat front" }
best = { file = "lenses/explainer/02-best-form.lens", label = "Single lens, best form" }
achromat = { file = "lenses/explainer/04-achromat.lens", label = "Cemented achromat" }
landscape = { file = "lenses/explainer/05-landscape.lens", label = "Landscape lens (Wollaston, 1812)" }
rr = { file = "lenses/explainer/06-rapid-rectilinear.lens", label = "Rapid Rectilinear (1866)" }
triplet = { file = "lenses/explainer/07-triplet.lens", label = "Cooke triplet (Taylor, 1893)" }
triplet_f2 = { file = "lenses/explainer/08-triplet-f2.lens", label = "Triplet redesigned for f/2" }
clark = { file = "lenses/explainer/09-clark.lens", label = "Clark (1888)" }
planar = { file = "lenses/explainer/10-planar.lens", label = "Planar (Rudolph, 1896)" }
dgauss = { file = "lenses/explainer/11b-double-gauss.lens", label = "Double Gauss" }
summilux = { file = "lenses/summilux-50-asph.lens", label = "Leica Summilux 50 f/1.4 ASPH (reconstruction)" }

# The recap: each design with the idea it added.
[[recap]]
lens = "best"
label = "best-form singlet"
tool = "bend the glass"
[[recap]]
lens = "achromat"
label = "achromat"
tool = "two glasses"
[[recap]]
lens = "landscape"
label = "landscape lens"
tool = "move the stop"
[[recap]]
lens = "rr"
label = "Rapid Rectilinear"
tool = "symmetry"
[[recap]]
lens = "triplet"
label = "Cooke triplet"
tool = "negative lens inside"
[[recap]]
lens = "triplet_f2"
label = "triplet at f/2"
tool = "out of freedom"
[[recap]]
lens = "clark"
label = "Clark"
tool = "curl around the stop"
[[recap]]
lens = "planar"
label = "Planar"
tool = "buried cemented surface"
[[recap]]
lens = "dgauss"
label = "double Gauss"
tool = "break the symmetry"

# ---------------------------------------------------------------- 0 Hook
[[chapter]]
id = "hook"
title = ""
narration = """This picture was taken through one piece of glass. This one, through six.
Same scene, same focal length. Why does a sharp picture take six pieces of glass?
Let's build a lens from scratch, and find out."""
scene = "real"
lens = "dgauss"
fstop = 2
full = 1
split_lens = "singlet"
split_fstop = 4
split = 1
diagram = false
scoreboard = false
hud = false
insets = false
fields = [0.0]
tail = 0.6

[[chapter.key]]
at = "@This#2-0.2"
dur = 1.2
split = 0.5

# ---------------------------------------------------------------- 1 The job
[[chapter]]
id = "job"
title = "The job"
number = 1
narration = """A lens has one job: every ray from a point in the scene must land on one point on the sensor.
There are seven classic ways to miss: the aberrations.
This scoreboard measures each one on the sensor, in thousandths of a millimetre. Green means smaller than a pixel."""
scene = "lesson"
lens = "dgauss"
fstop = 2
split = 0
fields = [0.0]
rays = 11

[[chapter.key]]
at = 0
dur = 1.2
full = 0

[[chapter.key]]
at = 1.0
diagram = true

[[chapter.key]]
at = "@sensor"
hud = true
insets = true

[[chapter.key]]
at = "@seven-0.2"
scoreboard = true

[[chapter.key]]
at = "@Green"
toolbox = true

[[chapter.note]]
at = "@one#2"
until = "@seven"
on = "diagram"
shape = "circle"
pos = [0.0, 0.0]
r = [4.0, 4.0]
text = "one point"
text_at = [-14.0, 10.0]

[[chapter.note]]
at = "@aberrations"
until = "@thousandths"
on = "scoreboard"
shape = "box"
pos = [0.135, 0.42]
r = [0.115, 0.29]

[[chapter.note]]
at = "@thousandths"
until = "@Green"
on = "scoreboard"
shape = "label"
pos = [0.5, 0.05]
text = "µm = thousandths of a mm"

[[chapter.note]]
at = "@Green"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.93, 0.43]
r = [0.065, 0.27]
color = "green"

# ---------------------------------------------------------------- 2 One lens
[[chapter]]
id = "one-lens"
title = "One lens"
number = 2
narration = """Start with the simplest lens: one bulging piece of glass, at f/4.
The picture is soft and glowing, and the corners are a smear.
Zoom in on the focus: rays through the edge of the lens cross too early.
A spherical surface bends edge rays too much. That's spherical aberration."""
lens = "singlet"
fstop = 4
tail = 1.4

[[chapter.key]]
at = "@Zoom"
focus_zoom = true

[[chapter.tag]]
at = "@spherical#2"
kind = "problem"
text = "spherical aberration"

[[chapter.note]]
at = "@glowing"
until = "@corners"
on = "centre"
shape = "circle"
pos = [0.765, 0.5]
r = [0.12, 0.18]
text = "glow"

[[chapter.note]]
at = "@smear"
until = "@Zoom"
on = "corner"
shape = "box"
pos = [0.5, 0.5]
r = [0.47, 0.45]
text = "smear"
text_at = [0.5, 0.15]

[[chapter.note]]
at = "@edge"
until = "end"
on = "view"
shape = "circle"
pos = [0.18, 0.52]
r = [0.07, 0.12]
text = "edge rays cross here"

[[chapter.note]]
at = "@spherical#2"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.208]
r = [0.49, 0.048]

# ---------------------------------------------------------------- 3 Bend it
[[chapter]]
id = "bend"
title = "Bend it"
number = 3
narration = """The same focal length comes in many shapes.
Bend the lens this way, and spherical aberration gets almost three times worse.
Bend it the other way, and both surfaces share the work, each bending light gently.
Gentle bends, small errors: remember that.
But look at the picture. It hardly improved. Something else is blurring it."""
focus_zoom = false
bending = true
tail = 1.2
tool = "bend the glass"
tool_at = "@Gentle"

[[chapter.key]]
at = "@this"
dur = 2.0
lens = "flat"
morph = true

[[chapter.key]]
at = "@other"
dur = 3.0
lens = "best"
morph = true

[[chapter.tag]]
at = "@other"
kind = "fix"
text = "bend the glass"

[[chapter.note]]
at = "@worse"
until = "@other"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.208]
r = [0.49, 0.048]
color = "red"

[[chapter.note]]
at = "@share"
until = "@Gentle"
on = "diagram"
shape = "arrow"
pos = [-62.0, 20.0]
to = [-50.0, 8.5]
text = "both surfaces bend"

[[chapter.note]]
at = "@hardly"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.838]
r = [0.49, 0.048]

[[chapter.note]]
at = "@Something"
until = "end"
on = "centre"
shape = "circle"
pos = [0.765, 0.5]
r = [0.12, 0.18]

# ---------------------------------------------------------------- 4 Colour
[[chapter]]
id = "colour"
title = "Colour"
number = 4
narration = """Glass bends blue light more than red, so every colour comes to focus at its own distance:
blue almost a millimetre in front of red.
That coloured haze is most of our blur. It's called axial chromatic aberration."""
bending = false
by_wavelength = true
focus_zoom = true
tail = 1.4

[[chapter.tag]]
at = "@axial"
kind = "problem"
text = "axial colour"

[[chapter.note]]
at = "@millimetre"
until = "end"
on = "view"
shape = "label"
pos = [0.32, 0.27]
text = "blue focuses first"
color = "blue"

[[chapter.note]]
at = "@haze"
until = "end"
on = "centre"
shape = "circle"
pos = [0.765, 0.5]
r = [0.12, 0.18]
text = "coloured haze"

[[chapter.note]]
at = "@axial"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.597]
r = [0.49, 0.048]

# ---------------------------------------------------------------- 5 Stop down
[[chapter]]
id = "stop-down"
title = "Stop down"
number = 5
narration = """The crude fix: block the edge of the lens.
At f/16, every blur shrinks, colour included, and the centre is sharp.
But we let in sixteen times less light: an eighth of a second instead of a hundred-twenty-fifth.
And the corners are still a mess."""
by_wavelength = false
focus_zoom = false
dim_ref = 4
dim = 1
tail = 1.2
tool = "stop down (costs light)"

[[chapter.key]]
at = "@block"
dur = 2.5
fstop = 16

[[chapter.key]]
at = "@eighth"
dur = 1.5
dim = 0

[[chapter.tag]]
at = "@crude"
kind = "fix"
text = "stop down"

[[chapter.note]]
at = "@sharp"
until = "@sixteen"
on = "centre"
shape = "circle"
pos = [0.236, 0.5]
r = [0.2, 0.3]
text = "sharp"
color = "green"

[[chapter.note]]
at = "@sixteen"
until = "@corners"
on = "hud"
shape = "box"
pos = [0.625, 0.5]
r = [0.12, 0.42]

[[chapter.note]]
at = "@corners"
until = "end"
on = "corner"
shape = "box"
pos = [0.5, 0.5]
r = [0.47, 0.45]
color = "red"

# ---------------------------------------------------------------- 6 Two glasses
[[chapter]]
id = "two-glasses"
title = "Two glasses"
number = 6
narration = """The clever fix, from the 1750s: cement a weak negative lens of flint glass to the crown.
Flint spreads colours much more, so a weak flint cancels the colour of a strong crown, while most of the focusing power survives.
The pair cancels spherical aberration too.
At f/8 the centre is perfectly sharp, with four times the light of f/16. Now look at the corners."""
lens = "achromat"
fstop = 8
dim = 0
tail = 1.2
tool = "two glasses"

[[chapter.key]]
at = "@flint"
highlight = 1

[[chapter.key]]
at = "@pair"
highlight = -1

[[chapter.tag]]
at = "@clever"
kind = "fix"
text = "two glasses: crown + flint"

[[chapter.note]]
at = "@cancels"
until = "@pair"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.597]
r = [0.49, 0.048]

[[chapter.note]]
at = "@perfectly"
until = "@corners"
on = "centre"
shape = "circle"
pos = [0.5, 0.5]
r = [0.45, 0.44]
color = "green"

[[chapter.note]]
at = "@four"
until = "@corners"
on = "hud"
shape = "box"
pos = [0.375, 0.5]
r = [0.12, 0.42]

[[chapter.note]]
at = "@corners"
until = "end"
on = "corner"
shape = "box"
pos = [0.5, 0.5]
r = [0.47, 0.45]

# ---------------------------------------------------------------- 7 Off-axis
[[chapter]]
id = "off-axis"
title = "Off-axis"
number = 7
narration = """Light from the edge of the frame meets the lens at an angle, and sees a lopsided lens.
That gives points comet tails: coma. Here it's small.
Much worse: lines pointing at the centre and lines across them focus at different distances. That's astigmatism.
And the sharpest image doesn't lie on the flat sensor, but on a curved bowl:
no single focus is sharp everywhere."""
fields = [0.0, 1.0]
tail = 1.6

[[chapter.key]]
at = "@sharpest"
field_curves = true

[[chapter.tag]]
at = "@astigmatism"
kind = "problem"
text = "astigmatism"

[[chapter.tag]]
at = "@bowl"
kind = "problem"
text = "curved field"

[[chapter.note]]
at = "@coma"
until = "@Much"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.286]
r = [0.49, 0.048]

[[chapter.note]]
at = "@astigmatism"
until = "@bowl"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.364]
r = [0.49, 0.048]

[[chapter.note]]
at = "@bowl"
until = "end"
on = "diagram"
shape = "arrow"
pos = [-22.0, 21.0]
to = [-4.8, 14.0]
text = "sharpest image"

# ---------------------------------------------------------------- 8 Move the stop
[[chapter]]
id = "move-stop"
title = "Move the stop"
number = 8
narration = """William Wollaston's trick, from 1812: put the aperture in front of the lens, and bend the lens into a meniscus.
Each point of the field now passes through its own part of the lens, and the corners snap into focus.
The price: it only works at f/14.
Lenses like this photographed the world for decades."""
tail = 1.2
tool = "move the stop"

[[chapter.key]]
at = "@aperture"
dur = 3.5
lens = "landscape"
morph = true
fstop = 14

[[chapter.key]]
at = "@Lenses"
field_curves = false

[[chapter.tag]]
at = "@trick"
kind = "fix"
text = "move the stop"

[[chapter.note]]
at = "@own"
until = "@snap"
on = "diagram"
shape = "arrow"
pos = [-75.0, -20.0]
to = [-47.0, -5.0]
text = "its own part of the lens"

[[chapter.note]]
at = "@snap"
until = "@price"
on = "corner"
shape = "box"
pos = [0.5, 0.5]
r = [0.47, 0.45]
color = "green"

[[chapter.note]]
at = "@price"
until = "end"
on = "hud"
shape = "box"
pos = [0.375, 0.5]
r = [0.12, 0.42]

# ---------------------------------------------------------------- 9 Distortion
[[chapter]]
id = "distortion"
title = "Distortion"
number = 9
narration = """But look at the grid. The straight lines bow outwards.
With the stop in front, light from the edges crosses the lens off-centre, and is squeezed inwards.
Almost four percent of barrel distortion: fine for trees, fatal for buildings."""
tail = 1.4

[[chapter.key]]
at = "@straight"
ideal_grid = true

[[chapter.tag]]
at = "@barrel"
kind = "problem"
text = "distortion"

[[chapter.note]]
at = "@bow"
until = "@barrel"
on = "render"
shape = "circle"
pos = [0.06, 0.5]
r = [0.05, 0.38]
text = "bowed"

[[chapter.note]]
at = "@squeezed"
until = "end"
on = "render"
shape = "arrow"
pos = [0.985, 0.08]
to = [0.93, 0.13]

[[chapter.note]]
at = "@percent"
until = "end"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.519]
r = [0.49, 0.048]

# ---------------------------------------------------------------- 10 Symmetry
[[chapter]]
id = "symmetry"
title = "Symmetry"
number = 10
narration = """The answer is symmetry. Put a mirror copy of the lens behind the stop.
Whatever the front half distorts, the back half undoes, and lateral colour cancels the same way.
This is the Rapid Rectilinear of 1866: straight lines, at f/8, three times faster than the landscape lens."""
tail = 1.4
tool = "symmetry"

[[chapter.key]]
at = "@mirror"
dur = 0
lens = "rr"
fstop = 8

[[chapter.key]]
at = "end-0.5"
ideal_grid = false

[[chapter.tag]]
at = "@symmetry"
kind = "fix"
text = "symmetry"

[[chapter.note]]
at = "@mirror+0.4"
until = "@Whatever"
on = "diagram"
shape = "label"
pos = [-51.0, 15.0]
text = "mirror image"

[[chapter.note]]
at = "@undoes"
until = "@lateral"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.519]
r = [0.49, 0.048]

[[chapter.note]]
at = "@lateral"
until = "@Rapid"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.675]
r = [0.49, 0.048]

[[chapter.note]]
at = "@three"
until = "end"
on = "hud"
shape = "box"
pos = [0.375, 0.5]
r = [0.12, 0.42]

# ---------------------------------------------------------------- 11 Petzval
[[chapter]]
id = "petzval"
title = "The curved field"
number = 11
narration = """One error survives everything we've tried: the curved field.
This lens hides it as astigmatism: its two sharp surfaces bend away on either side of the sensor.
Joseph Petzval showed that it depends only on the power and the glass of each element, not on its shape or position.
Every positive lens curves the field. Only a negative lens can flatten it,
but a negative lens also undoes the focusing."""
field_curves = true
tail = 1.4

[[chapter.tag]]
at = "@curved"
kind = "problem"
text = "curved field"

[[chapter.note]]
at = "@astigmatism"
until = "@Joseph"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.364]
r = [0.49, 0.048]

[[chapter.note]]
at = "@either"
until = "@Joseph"
on = "view"
shape = "label"
pos = [0.62, 0.62]
text = "T and S"
color = "white"

[[chapter.note]]
at = "@Every#2"
until = "end"
on = "view"
shape = "label"
pos = [0.5, 0.25]
text = "Petzval: set by power and glass"
color = "white"

# ---------------------------------------------------------------- 12 Triplet
[[chapter]]
id = "triplet"
title = "The Cooke triplet"
number = 12
narration = """In 1893, Dennis Taylor found the way out: put a strong negative lens between two positive ones, where the beam is narrow.
There it costs little focusing power, but still counts fully against the curved field.
Six curvatures and two spacings: just enough freedom to balance all seven errors.
The Cooke triplet: sharp across the frame at f/3.5, five times faster than the Rapid Rectilinear."""
lens = "triplet"
fstop = 3.5
field_curves = false
fields = [0.0, 0.7, 1.0]
tail = 1.4
tool = "negative lens inside"

[[chapter.key]]
at = "@narrow-0.8"
dur = 1.2
diagram_zoom = 1.8

[[chapter.key]]
at = "@narrow"
beam = true
highlight = 1

[[chapter.key]]
at = "@Six"
beam = false
highlight = -1

[[chapter.key]]
at = "@Six"
dur = 1.2
diagram_zoom = 1

[[chapter.tag]]
at = "@negative"
kind = "fix"
text = "negative lens inside"

[[chapter.note]]
at = "@narrow"
until = "@Six"
on = "diagram"
shape = "arrow"
pos = [-32.0, 12.0]
to = [-50.0, 5.0]
text = "narrow beam"

[[chapter.note]]
at = "@sharp"
until = "@five"
on = "scoreboard"
shape = "box"
pos = [0.5, 0.875]
r = [0.49, 0.088]
color = "green"

[[chapter.note]]
at = "@five"
until = "end"
on = "hud"
shape = "box"
pos = [0.375, 0.5]
r = [0.12, 0.42]

# ---------------------------------------------------------------- 13 Triplet at f/2
[[chapter]]
id = "triplet-f2"
title = "Pushing the triplet"
number = 13
narration = """Now redesign the triplet for f/2. The glow is back.
With the bigger aperture, spherical aberration and coma grow faster than three lenses can balance them.
The triplet has run out of freedom."""
lens = "triplet_f2"
fstop = 2
tail = 1.6

[[chapter.tag]]
at = "@freedom"
kind = "problem"
text = "out of freedom"

[[chapter.note]]
at = "@glow"
until = "@spherical"
on = "centre"
shape = "circle"
pos = [0.765, 0.5]
r = [0.12, 0.18]

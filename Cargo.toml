[package]
name = "lens-render"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "exr"] }
pollster = "1.0.1"
rayon = "1.12.0"
resvg = "0.49.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

# Night street: a sign in focus at 1.5 m, strings of tungsten lights
# receding into the distance (bokeh, cat's eye), and a bright street lamp
# that produces ghosts / flare.
background = [0.004, 0.005, 0.012]

[camera]
lens = "../lenses/cooke-triplet.lens"
width = 1200
focus_distance = 1.5
spp = 64
iris_blades = 6
coating = "single"

# The sign, lit by the street lamp.
[[object]]
type = "plane"
center = [-0.12, -0.05, 1.5]
size = [0.45, 0.3]
texture = { kind = "chart" }
brightness = 0.5

# Hedge behind the sign.
[[object]]
type = "plane"
center = [0, -1.6, 6.0]
size = [14, 2.0]
texture = { kind = "noise", scale = 40, palette = [[0.002, 0.004, 0.001], [0.01, 0.025, 0.006], [0.02, 0.04, 0.01]] }

[[object]]
type = "light_string"
from = [-2.5, 0.35, 4.0]
to = [3.0, 0.9, 30.0]
count = 28
radius = 0.006
temperature = 2700
radiance = 250

[[object]]
type = "light_string"
from = [-3.0, -0.4, 6.0]
to = [2.0, -0.45, 9.0]
count = 18
radius = 0.006
temperature = 3200
radiance = 250

# Street lamp.
[[object]]
type = "light"
center = [1.9, 1.1, 9.0]
radius = 0.05
temperature = 4200
radiance = 40000

# Out-of-focus point lights across the field: the bokeh shows the iris
# shape, spherical aberration (uneven disc brightness), longitudinal colour
# (coloured rims) and mechanical vignetting (cat's eye towards the corners).
background = [0.0, 0.0, 0.0]

[camera]
lens = "../lenses/cooke-triplet.lens"
width = 1200
focus_distance = 0.5
spp = 16
light_samples = 8000000

# Behind the focus plane.
[[object]]
type = "light_string"
from = [-1.6, 1.0, 6.0]
to = [1.6, 1.0, 6.0]
count = 5
radius = 0.004
temperature = 5000
radiance = 250

[[object]]
type = "light_string"
from = [-1.6, 0.0, 6.0]
to = [1.6, 0.0, 6.0]
count = 5
radius = 0.004
temperature = 5000
radiance = 250

[[object]]
type = "light_string"
from = [-1.6, -1.0, 6.0]
to = [1.6, -1.0, 6.0]
count = 5
radius = 0.004
temperature = 5000
radiance = 250

# In front of the focus plane: spherical aberration flips the disc profile.
[[object]]
type = "light_string"
from = [-0.025, 0.035, 0.3]
to = [0.025, 0.035, 0.3]
count = 2
radius = 0.0003
temperature = 5000
radiance = 60

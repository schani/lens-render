# Test bench for the explainer video: a chart wall at 2.5 m filling the frame
# of a 50 mm lens (grid for distortion, Siemens stars at the centre and near
# the corners at ~0.9 field for sharpness), with small point lights on black
# cards beside the centre star, at 0.7 field and beside the bottom-left
# star (blur shapes: spherical aberration, coma, astigmatism, colour).
background = [0.02, 0.02, 0.02]

[camera]
lens = "../lenses/double-gauss.lens"
width = 1800
focus_distance = 2.5
spp = 64

[[object]]
type = "plane"
center = [0, 0, 2.5]
size = [1.95, 1.3]
texture = { kind = "chart", stars = 0.5 }

[[object]]
type = "plane"
center = [0.11, 0.0, 2.49]
size = [0.07, 0.07]
texture = { kind = "color", rgb = [0.03, 0.03, 0.03] }

[[object]]
type = "light"
center = [0.11, 0.0, 2.47]
radius = 0.0015
temperature = 5500
radiance = 3000

[[object]]
type = "plane"
center = [0.617, 0.412, 2.49]
size = [0.07, 0.07]
texture = { kind = "color", rgb = [0.03, 0.03, 0.03] }

[[object]]
type = "light"
center = [0.617, 0.412, 2.47]
radius = 0.0015
temperature = 5500
radiance = 3000

[[object]]
type = "plane"
center = [-0.709, -0.494, 2.49]
size = [0.07, 0.07]
texture = { kind = "color", rgb = [0.03, 0.03, 0.03] }

[[object]]
type = "light"
center = [-0.709, -0.494, 2.47]
radius = 0.0015
temperature = 5500
radiance = 3000
